# Локальная конфигурация агента для `make agent-run` (запуск без установки службы).
# Разбор и значения по умолчанию — agent/internal/service/config.go.
# Адрес сервера замеров, пороги и расписание сюда не пишутся — агент получает их
# с сервера (GET /api/agent/config, T-17).

# Адрес API сервера мониторинга (локальный backend, `make api`).
server_url: http://localhost:8000

# Кабинет, в котором стоит этот компьютер (попадает в точку мониторинга).
room: "Серверная"

# Код установки для привязки устройства к школе (T-07). Локально оставьте пустым.
enroll_code: ""

# Папка состояния, журнала и (позже) очереди. Относительный путь — от папки этого файла.
# По умолчанию: %ProgramData%\VKO Monitor на Windows, /var/lib/vko-agent на Linux.
data_dir: .data

# Уровень журнала: debug, info, warn, error (по умолчанию info).
log_level: debug

# Alembic configuration. The database URL is not stored here: alembic/env.py takes it from
# Settings (DATABASE_URL in the environment or .env). Run from backend/: `alembic upgrade head`.

[alembic]
script_location = alembic

# Revision file names: YYYYMMDD_HHMM_short_name (CONTRIBUTING.md §6).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
truncate_slug_length = 40
# The timestamp in the file name and in "Create Date" is taken in this zone, not in the
# developer's machine zone (ADR-014), so revisions from different machines sort consistently.
timezone = Asia/Almaty

# Make `app` importable when alembic runs from backend/.
prepend_sys_path = .

version_path_separator = os

# Lint-fix and format every generated revision with ruff so `make check-backend` stays green
# (drops unused imports in empty revisions, sorts imports, applies the project format).
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

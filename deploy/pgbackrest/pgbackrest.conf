# Резервное копирование БД (T-53, plan.md §13).
#
# Файл монтируется в контейнеры db и pgbackrest как /etc/pgbackrest/pgbackrest.conf.
# Контейнер db вызывает отсюда archive-push (archive_command в docker-compose.yml),
# контейнер pgbackrest — ежедневный полный бэкап (deploy/pgbackrest/backup.sh).
#
# Секретов здесь нет: подключение к базе идёт по unix-сокету от имени postgres,
# пароль не нужен. Хранилище — том pgbackrest_repo, путь переопределяется переменной
# PGBACKREST_REPO1_PATH, срок хранения — PGBACKREST_REPO1_RETENTION_FULL (.env.example).
#
# Восстановление — deploy/pgbackrest/README.md.

[global]
repo1-path=/var/lib/pgbackrest
# Полных бэкапов держим 7: неделя истории, дальше pgbackrest expire убирает вместе с их WAL.
repo1-retention-full=7
# Мелкие файлы складываются в общие пакеты: у базы много маленьких файлов отношений.
repo1-bundle=y
compress-type=zst
compress-level=3
process-max=2
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail
# Не ждать ближайшей контрольной точки: бэкап начинается сразу, ценой всплеска записи.
start-fast=y

[vko]
pg1-path=/home/postgres/pgdata/data
# Сокет общий для контейнеров db и pgbackrest (том pgsocket): libpq ходит по нему,
# TCP и пароль не нужны, наружу ничего не открывается.
pg1-socket-path=/var/run/postgresql
pg1-port=5432
pg1-user=postgres
pg1-database=postgres

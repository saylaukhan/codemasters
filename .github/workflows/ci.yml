# Runs the same checks as `make check`, one job per part (ADR-001, ADR-002).
name: CI

permissions:
  contents: read

on:
  push:
    branches: [developing, main]
  workflow_dispatch:

jobs:
  agent:
    name: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          # The module has no external dependencies yet, so there is no go.sum to key a cache on.
          cache: false
      # Lints agent/ with agent/.golangci.yml and leaves golangci-lint on PATH, so
      # `make check-agent` below runs the same linter together with the other checks.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: agent
      - run: make check-agent

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: make backend-install
      - run: make check-backend

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - run: make check-web
